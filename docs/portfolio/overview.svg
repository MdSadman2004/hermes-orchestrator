<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960"><rect width="1600" height="960" fill="#f3eee4"/>
<text x="64" y="124" font-family="Libre Caslon Display, Georgia, serif" font-size="76" fill="#2c2925">Hermes CLI Orchestrator</text>
<text x="64" y="188" font-family="Manrope, sans-serif" font-size="28" fill="#58534b">Worker CLI routing, verifier-oriented execution, and local shared-state utilities.</text>
<line x1="64" y1="272" x2="1536" y2="272" stroke="#c9beb0" stroke-width="1"/>
<text x="64" y="316" font-family="Manrope, sans-serif" font-size="22" fill="#964c36">Agents &amp; tooling</text>
<text x="760" y="316" font-family="Manrope, sans-serif" font-size="22" fill="#58534b">Files to start with</text>
<text x="64" y="392" font-family="Manrope, sans-serif" font-size="32" fill="#2c2925">Worker dispatch</text>
<text x="64" y="430" font-family="Manrope, sans-serif" font-size="22" fill="#58534b">CLI routes, fallback, subprocess capture, and</text>
<text x="64" y="459" font-family="Manrope, sans-serif" font-size="22" fill="#58534b">timeouts.</text>
<text x="760" y="385" font-family="Manrope, sans-serif" font-size="20" fill="#58534b">orchestrator/dispatch.py</text>
<line x1="64" y1="490" x2="1536" y2="490" stroke="#c9beb0" stroke-width="1"/>
<text x="64" y="550" font-family="Manrope, sans-serif" font-size="32" fill="#2c2925">Verification harness</text>
<text x="64" y="588" font-family="Manrope, sans-serif" font-size="22" fill="#58534b">Step verifiers, retries, checkpoints, and</text>
<text x="64" y="617" font-family="Manrope, sans-serif" font-size="22" fill="#58534b">ledgers.</text>
<text x="760" y="543" font-family="Manrope, sans-serif" font-size="20" fill="#58534b">orchestrator/harness.py</text>
<line x1="64" y1="648" x2="1536" y2="648" stroke="#c9beb0" stroke-width="1"/>
<text x="64" y="708" font-family="Manrope, sans-serif" font-size="32" fill="#2c2925">Shared memory</text>
<text x="64" y="746" font-family="Manrope, sans-serif" font-size="22" fill="#58534b">Per-entry files, JSONL index, and vector-clock</text>
<text x="64" y="775" font-family="Manrope, sans-serif" font-size="22" fill="#58534b">metadata.</text>
<text x="760" y="701" font-family="Manrope, sans-serif" font-size="20" fill="#58534b">orchestrator/memory_bus.py</text>
<line x1="64" y1="806" x2="1536" y2="806" stroke="#c9beb0" stroke-width="1"/>
<text x="64" y="898" font-family="Manrope, sans-serif" font-size="23" fill="#58534b">Source guide, not a runtime screenshot or a benchmark.</text>
<text x="64" y="932" font-family="Manrope, sans-serif" font-size="18" fill="#58534b">github.com/MdSadman2004/hermes-orchestrator</text>
</svg>